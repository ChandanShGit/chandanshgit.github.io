<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--accent);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: var(--bg-color);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 16px;
        }

        p.bio {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .tag {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: var(--accent);
            color: var(--bg-color);
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-muted);
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Replace initial with image tag if you have one: <img src="avatar.jpg" class="profile-img"> -->
        <div class="profile-img">👋</div>
        
        <h1>Your Name</h1>
        <p class="subtitle">Software Developer / Tech Enthusiast</p>
        
        <p class="bio">
            Welcome to my personal homepage hosted on GitHub Pages. I build web and mobile applications, experiment with modern tech stacks, and create open-source software.
        </p>

        <div class="tags">
            <span class="tag">HTML/CSS</span>
            <span class="tag">JavaScript</span>
            <span class="tag">GitHub Pages</span>
        </div>

        <div class="links">
            <a href="https://github.com/your-username" target="_blank" class="btn">View GitHub Profile</a>
            <a href="mailto:your-email@example.com" class="btn btn-outline">Get in Touch</a>
        </div>
    </div>

</body>
</html>
